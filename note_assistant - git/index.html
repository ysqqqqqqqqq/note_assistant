<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>笔记智能批注工具</title>
  <script src="./assets/html-to-image.min.js"></script>
  <script src="./assets/sql-wasm.js"></script>
  <script src="./assets/docx.umd.js"></script>
  <style>
    :root {
      --tc: #3b82f6; --tc-dark: #2563eb;
      --tc-bg: rgba(59,130,246,0.04); --tc-hover: rgba(59,130,246,0.10);
      --tc-light: rgba(59,130,246,0.06); --tc-tag-bg: rgba(59,130,246,0.06);
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                   "Helvetica Neue", Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
      background:#f0f2f5; color:#333; line-height:1.6; min-height:100vh;
    }
    .top-section { max-width:1440px; margin:0 auto; padding:24px 24px 0; }
    .page-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
    .page-title { font-size:22px; font-weight:700; color:#1a1a2e; letter-spacing:.5px; }
    .settings-btn {
      width:36px; height:36px; border:1px solid #ddd; border-radius:8px;
      background:#fff; font-size:18px; cursor:pointer; display:flex;
      align-items:center; justify-content:center; transition:all .15s;
    }
    .settings-btn:hover { border-color:var(--tc); background:var(--tc-bg); }
    .editor-label { display:block; font-size:14px; font-weight:600; color:#555; margin-bottom:6px; }
    #note-input {
      width:100%; height:180px; padding:14px 16px; border:1px solid #d0d5dd;
      border-radius:8px; font-size:14px; line-height:1.7; resize:vertical;
      font-family:inherit; background:#fff; transition:border-color .2s;
    }
    #note-input:focus { outline:none; border-color:var(--tc); box-shadow:0 0 0 3px var(--tc-light); }
    .btn-bar { display:flex; flex-wrap:wrap; gap:10px; margin-top:14px; padding-bottom:18px; border-bottom:1px solid #e8e8e8; align-items:center; }
    .btn { padding:9px 22px; border:none; border-radius:6px; font-size:14px; font-weight:500; cursor:pointer; transition:all .15s; user-select:none; }
    .btn:active { transform:scale(.97); }
    .btn-primary { background:var(--tc); color:#fff; }
    .btn-primary:hover { opacity:.88; }
    .btn-secondary { background:#fff; color:var(--tc); border:1px solid var(--tc); }
    .btn-secondary:hover { background:var(--tc-tag-bg); }
    .btn-tertiary { background:#fff; color:#555; border:1px solid #ddd; }
    .btn-tertiary:hover { border-color:var(--tc); color:var(--tc); }
    .btn-danger { background:#fff; color:#e74c3c; border:1px solid #e74c3c; }
    .btn-danger:hover:not(:disabled) { background:rgba(231,76,60,0.06); }
    .btn-push-right { margin-left:auto; }

    /* ── 设置面板控件 ─────────────────── */
    .setting-input {
      width:100%; padding:8px 12px; border:1px solid #d0d5dd; border-radius:6px;
      font-size:13px; line-height:1.5; background:#fff; font-family:inherit; transition:border-color .2s;
    }
    .setting-input:focus { outline:none; border-color:var(--tc); box-shadow:0 0 0 3px var(--tc-light); }
    .setting-row { margin-bottom:12px; }
    .setting-row label { display:block; font-size:13px; color:#555; margin-bottom:4px; font-weight:500; }
    .setting-hint { font-size:11px; color:#999; margin-top:4px; }
    .setting-check { display:flex; align-items:center; gap:8px; font-size:13px; color:#555; cursor:pointer; }
    .setting-check input[type="checkbox"] { accent-color:var(--tc); width:16px; height:16px; }
    .setting-divider { border:none; border-top:1px solid #eee; margin:16px 0; }
    .setting-tip { font-size:11px; color:#999; line-height:1.6; padding:8px 10px; background:#f8f9fa; border-radius:4px; }

    /* ── 设置弹窗 / 手动批注弹窗 ────────────── */
    .modal-overlay {
      display:none; position:fixed; inset:0; background:rgba(0,0,0,.35);
      z-index:1000; align-items:center; justify-content:center;
    }
    .modal-overlay.open { display:flex; }
    .modal-box {
      background:#fff; border-radius:12px; padding:28px 32px; min-width:320px;
      box-shadow:0 8px 32px rgba(0,0,0,.15); position:relative;
    }
    .modal-close {
      position:absolute; top:12px; right:14px; border:none; background:transparent;
      font-size:20px; cursor:pointer; color:#999; font-weight:700;
    }
    .modal-close:hover { color:#333; }
    .modal-title { font-size:16px; font-weight:700; margin-bottom:20px; color:#1a1a2e; }
    .modal-section { margin-bottom:18px; }
    .modal-label { font-size:12px; font-weight:600; color:#999; text-transform:uppercase; letter-spacing:.5px; margin-bottom:8px; }
    .theme-row { display:flex; gap:10px; }
    .theme-dot {
      width:28px; height:28px; border-radius:50%; border:2px solid transparent;
      cursor:pointer; transition:all .15s;
    }
    .theme-dot:hover { transform:scale(1.15); }
    .theme-dot.active { border-color:#333; box-shadow:0 0 0 2px rgba(0,0,0,.12); }
    .theme-dot[data-color="blue"]  { background:#3b82f6; }
    .theme-dot[data-color="green"] { background:#10b981; }
    .theme-dot[data-color="pink"]  { background:#ec4899; }
    .theme-dot[data-color="black"] { background:#1e293b; }
    .theme-dot[data-color="red"]   { background:#e74c3c; }
    .lang-row { display:flex; gap:8px; }
    .lang-btn {
      padding:6px 18px; border:1px solid #ddd; border-radius:6px;
      background:#fff; font-size:13px; cursor:pointer; transition:all .15s;
    }
    .lang-btn:hover { border-color:var(--tc); }
    .lang-btn.active { background:var(--tc); color:#fff; border-color:var(--tc); }

    /* ── 手动批注弹窗专用样式 ───────────────── */
    .ann-type-row { display:flex; gap:16px; margin-bottom:4px; }
    .ann-type-label {
      display:flex; align-items:center; gap:6px; font-size:14px; cursor:pointer;
      padding:6px 14px; border:1.5px solid #ddd; border-radius:6px; transition:all .15s;
    }
    .ann-type-label:hover { border-color:var(--tc); }
    .ann-type-label input[type="radio"] { accent-color:var(--tc); }
    .ann-type-label.checked { border-color:var(--tc); background:var(--tc-bg); }
    #manual-explanation {
      width:100%; height:80px; padding:10px 12px; border:1px solid #d0d5dd;
      border-radius:6px; font-size:13px; line-height:1.6; resize:vertical;
      font-family:inherit; background:#fff; transition:border-color .2s;
    }
    #manual-explanation:focus { outline:none; border-color:var(--tc); box-shadow:0 0 0 3px var(--tc-light); }
    .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:20px; }
    .modal-selected-text {
      font-size:13px; color:#666; margin-bottom:12px; padding:8px 10px;
      background:#f8f9fa; border-radius:4px; word-break:break-all; line-height:1.5;
    }

    /* ── 主内容区 ─────────────────────────── */
    .main-content {
      display:flex; gap:0; max-width:1440px; margin:0 auto;
      background:#fff; border-radius:0 0 12px 12px;
      box-shadow:0 1px 4px rgba(0,0,0,.06); min-height:520px;
    }
    .preview-panel { flex:3; padding:28px 32px; border-right:1px solid #eee; overflow-y:auto; max-height:75vh; }
    .preview-panel h3, .cards-panel h3 {
      font-size:13px; font-weight:600; color:#999; text-transform:uppercase;
      letter-spacing:1px; margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid #f0f0f0;
    }
    #preview-content { font-size:15px; line-height:2.2; white-space:pre-wrap; word-wrap:break-word; color:#2c2c2c; }
    .mark-term {
      border:1.5px solid var(--tc); border-radius:4px; padding:1px 5px; margin:0 1px;
      background:var(--tc-bg); color:inherit; font-size:inherit; line-height:inherit;
      display:inline; position:relative; transition:background .15s; cursor:pointer;
    }
    .mark-term:hover { background:var(--tc-hover); }
    .mark-sentence {
      text-decoration:underline wavy var(--tc); text-underline-offset:4px;
      padding:0 1px; color:inherit; font-size:inherit; display:inline;
      position:relative; cursor:pointer;
    }
    .mark-sentence:hover { background:var(--tc-light); border-radius:2px; }
    .mark-badge {
      position:absolute; top:-10px; right:-10px;
      min-width:18px; height:18px; padding:0 3px;
      border-radius:9px; font-size:10px; font-weight:700;
      display:flex; align-items:center; justify-content:center;
      z-index:10; pointer-events:none; line-height:1;
      box-shadow:0 1px 3px rgba(0,0,0,.15);
    }
    .mark-badge.badge-term { background:var(--tc); color:#fff; }
    .mark-badge.badge-sentence {
      top:auto; right:-14px; bottom:-6px;
      background:#fff; color:var(--tc); border:1.5px solid var(--tc);
    }
    .cards-panel { flex:2; padding:28px 24px; overflow-y:auto; max-height:75vh; background:#fafbfc; border-radius:0 0 12px 0; }
    .cards-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; padding-bottom:10px; border-bottom:1px solid #f0f0f0; }
    .cards-header h3 { margin-bottom:0; padding-bottom:0; border-bottom:none; }
    .btn-add-ann { padding:4px 12px; border:1px solid var(--tc); border-radius:4px; background:#fff; color:var(--tc); font-size:12px; font-weight:500; cursor:pointer; transition:all .15s; }
    .btn-add-ann:hover { background:var(--tc-tag-bg); }
    .annotation-card {
      position:relative; background:#fff; border:1px solid #eee;
      border-left:3px solid var(--tc); border-radius:6px;
      padding:14px 16px 14px 20px; margin-bottom:14px; transition:box-shadow .15s;
    }
    .annotation-card:hover { box-shadow:0 2px 8px rgba(0,0,0,.06); }
    .annotation-card::before {
      content:''; position:absolute; left:-28px; top:50%;
      width:25px; height:0; border-top:1.5px solid var(--tc); transform:translateY(-50%);
    }
    .annotation-card::after {
      content:''; position:absolute; left:-28px; top:50%;
      width:0; height:0;
      border-top:4px solid transparent; border-bottom:4px solid transparent;
      border-right:6px solid var(--tc); transform:translateY(-50%);
    }
    .card-head { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
    .card-num {
      display:inline-flex; align-items:center; justify-content:center;
      width:22px; height:22px; background:var(--tc); color:#fff;
      border-radius:50%; font-size:12px; font-weight:600; flex-shrink:0;
    }
    .card-num.card-num-sentence { background:#fff; color:var(--tc); border:1.5px solid var(--tc); }
    .card-type { font-size:11px; padding:2px 8px; border-radius:3px; font-weight:500; letter-spacing:.3px; }
    .card-type.type-term { background:var(--tc-tag-bg); color:var(--tc); }
    .card-type.type-sentence { background:var(--tc-tag-bg); color:var(--tc-dark); }
    .card-content {
      font-size:14px; font-weight:600; color:#333; margin-bottom:8px;
      padding:6px 10px; background:#f8f9fa; border-radius:4px; line-height:1.6; word-break:break-all;
    }
    .card-explanation { font-size:13px; color:#666; line-height:1.7; border-top:1px dashed #eee; padding-top:8px; }
    .card-close-btn {
      position:absolute; top:8px; right:8px;
      width:20px; height:20px; border:none; background:transparent;
      color:var(--tc); font-size:16px; font-weight:700;
      cursor:pointer; display:none; align-items:center; justify-content:center;
      border-radius:50%; transition:all .15s; z-index:5; line-height:1;
    }
    .card-close-btn:hover { background:var(--tc-hover); }
    .annotation-card:hover .card-close-btn { display:flex; }
    body.exporting-png .card-close-btn { display:none !important; }
    @keyframes cardHighlight {
      0%   { background:var(--tc-tag-bg); }
      70%  { background:var(--tc-tag-bg); }
      100% { background:#fff; }
    }
    .annotation-card.card-highlight {
      animation: cardHighlight 2s ease forwards;
      box-shadow: 0 0 0 2px var(--tc), 0 4px 12px rgba(0,0,0,.08);
    }
    .empty-tip { text-align:center; color:#bbb; padding:48px 16px; font-size:14px; }
    .empty-tip span { display:block; font-size:32px; margin-bottom:12px; }

    /* ─ 历史记录弹窗 ─────────────────────── */
    #historyModal .modal-box { min-width:420px; max-width:560px; max-height:80vh; display:flex; flex-direction:column; }
    .history-search {
      width:100%; padding:8px 12px; border:1px solid #d0d5dd; border-radius:6px;
      font-size:13px; line-height:1.5; margin-bottom:14px; background:#fff;
    }
    .history-search:focus { outline:none; border-color:var(--tc); box-shadow:0 0 0 3px var(--tc-light); }
    .history-list {
      flex:1; overflow-y:auto; max-height:360px; margin-bottom:14px;
      border:1px solid #eee; border-radius:6px; background:#fafbfc;
    }
    .history-item {
      display:flex; align-items:center; gap:10px; padding:10px 12px;
      border-bottom:1px solid #f0f0f0; cursor:pointer; transition:background .12s;
    }
    .history-item:last-child { border-bottom:none; }
    .history-item:hover { background:var(--tc-bg); }
    .history-item-text {
      flex:1; font-size:13px; color:#333; line-height:1.5;
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
    }
    .history-item-time { font-size:11px; color:#999; white-space:nowrap; }
    .history-item-del {
      width:22px; height:22px; border:none; background:transparent;
      color:#ccc; font-size:16px; cursor:pointer; border-radius:4px;
      display:flex; align-items:center; justify-content:center; transition:all .12s;
    }
    .history-item-del:hover { color:var(--tc); background:var(--tc-hover); }
    .history-actions { display:flex; gap:8px; justify-content:flex-end; }
    .history-empty {
      text-align:center; color:#bbb; padding:40px 16px; font-size:13px; line-height:1.8;
    }
    .history-empty .empty-icon { display:block; font-size:28px; margin-bottom:8px; opacity:.6; }
    
    /* ── 知识库弹窗 ─────────────────────── */
    #kbModal .modal-box { min-width:420px; max-width:560px; max-height:80vh; display:flex; flex-direction:column; }
    .kb-upload-area {
      border:2px dashed #d0d5dd; border-radius:8px; padding:20px; text-align:center;
      margin-bottom:14px; cursor:pointer; transition:all .15s; background:#fafbfc;
    }
    .kb-upload-area:hover { border-color:var(--tc); background:var(--tc-bg); }
    .kb-upload-area input[type="file"] { display:none; }
    .kb-upload-label { font-size:13px; color:#888; }
    .kb-list { flex:1; overflow-y:auto; max-height:280px; margin-bottom:14px; border:1px solid #eee; border-radius:6px; background:#fafbfc; }
    .kb-item {
      display:flex; align-items:center; gap:10px; padding:10px 12px;
      border-bottom:1px solid #f0f0f0; transition:background .12s;
    }
    .kb-item:last-child { border-bottom:none; }
    .kb-item:hover { background:var(--tc-bg); }
    .kb-item-name { flex:1; font-size:13px; color:#333; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .kb-item-info { font-size:11px; color:#999; white-space:nowrap; }
    .kb-item-del {
      width:22px; height:22px; border:none; background:transparent;
      color:#ccc; font-size:16px; cursor:pointer; border-radius:4px;
      display:flex; align-items:center; justify-content:center; transition:all .12s;
    }
    .kb-item-del:hover { color:#e74c3c; background:rgba(231,76,60,0.08); }
    .kb-empty { text-align:center; color:#bbb; padding:32px 16px; font-size:13px; }

    /* ── 导出弹窗 ─────────────────────── */
    #exportModal .modal-box { min-width:360px; max-width:420px; }
    .export-options { display:flex; flex-direction:column; gap:12px; margin-bottom:20px; }
    .export-option {
      display:flex; align-items:center; gap:10px; padding:12px 16px;
      border:1.5px solid #ddd; border-radius:8px; cursor:pointer; transition:all .15s;
    }
    .export-option:hover { border-color:var(--tc); background:var(--tc-bg); }
    .export-option.selected { border-color:var(--tc); background:var(--tc-bg); }
    .export-option input[type="radio"] { accent-color:var(--tc); width:16px; height:16px; }
    .export-option-label { font-size:14px; color:#333; }
    @media (max-width:860px) {
      .main-content { flex-direction:column; }
      .preview-panel { border-right:none; border-bottom:1px solid #eee; max-height:none; }
      .cards-panel { max-height:none; }
      .annotation-card::before, .annotation-card::after { display:none; }
    }
  </style>
</head>
<body>

  <div class="top-section">
    <div class="page-header">
      <div class="page-title" data-i18n="title">笔记智能批注工具</div>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="settings-btn" onclick="toggleKB()" title="Knowledge Base" data-i18n-title="btnKB">📚</button>
        <button class="settings-btn" onclick="toggleHistory()" title="History" data-i18n-title="btnHistory">📋</button>
        <button class="settings-btn" onclick="toggleSettings()" title="Settings" data-i18n-title="settingsTitle">⚙</button>
      </div>
    </div>
    <label class="editor-label" for="note-input" data-i18n="editorLabel">编辑笔记文本</label>
    <textarea id="note-input" placeholder="请输入或粘贴笔记内容 …"></textarea>
    <div class="btn-bar">
      <button class="btn btn-primary" onclick="saveNote()" data-i18n="btnSaveNote">保存笔记</button>
      <button class="btn btn-tertiary" onclick="textDenoise()" data-i18n="btnDenoise">文本降噪</button>
      <button class="btn btn-primary" onclick="regenerateAnnotations()" data-i18n="btnGenerate">生成批注</button>
      <button class="btn btn-tertiary" onclick="pasteFromClipboard()" data-i18n="btnPaste">从剪贴板粘贴</button>
      <button class="btn btn-tertiary" onclick="clearText()" data-i18n="btnClear">清除文本</button>
      <button class="btn btn-secondary btn-push-right" onclick="toggleExportModal()" data-i18n="btnExport">导出</button>
    </div>
  </div>

  <div class="main-content" id="main-content">
    <div class="preview-panel">
      <h3 data-i18n="previewTitle">笔记预览</h3>
      <div id="preview-content">
        <div class="empty-tip"><span>📝</span>请在上方输入笔记文本，然后点击「生成批注」</div>
      </div>
    </div>
    <div class="cards-panel">
      <div class="cards-header">
        <h3 data-i18n="cardsTitle">批注卡片</h3>
        <button class="btn-add-ann" onclick="openManualAnnotation()" data-i18n="btnManual">添加</button>
      </div>
      <div id="cards-container">
        <div class="empty-tip"><span></span>暂无批注数据</div>
      </div>
    </div>
  </div>

  <!-- 知识库弹窗 -->
  <div class="modal-overlay" id="kbModal" onclick="closeKBOutside(event)">
    <div class="modal-box">
      <button class="modal-close" onclick="toggleKB()">&times;</button>
      <div class="modal-title" data-i18n="kbTitle">知识库管理</div>
      <div class="kb-upload-area" onclick="document.getElementById('kb-file-input').click()">
        <input type="file" id="kb-file-input" accept=".txt,.md,.csv" onchange="uploadKBFile(this)">
        <div class="kb-upload-label" data-i18n="kbUploadHint">点击上传文档（TXT / MD / CSV）</div>
      </div>
      <div class="kb-list" id="kb-list"></div>
      <div class="history-actions">
        <button class="btn btn-danger" onclick="clearAllKB()" data-i18n="btnClearKB">清空知识库</button>
        <button class="btn btn-primary" onclick="toggleKB()" data-i18n="btnClose">关闭</button>
      </div>
      <div id="kb-status" style="margin-top:10px;font-size:12px;color:#999;text-align:center;"></div>
    </div>
  </div>

  <!-- 导出弹窗 -->
  <div class="modal-overlay" id="exportModal" onclick="closeExportOutside(event)">
    <div class="modal-box">
      <button class="modal-close" onclick="toggleExportModal()">&times;</button>
      <div class="modal-title" data-i18n="exportTitle">导出</div>
      <div class="export-options">
        <label class="export-option selected" id="opt-png" onclick="selectExportFormat('png')">
          <input type="radio" name="export-format" value="png" checked>
          <span class="export-option-label" data-i18n="exportPNG">PNG 图片</span>
        </label>
        <label class="export-option" id="opt-word" onclick="selectExportFormat('word')">
          <input type="radio" name="export-format" value="word">
          <span class="export-option-label" data-i18n="exportWord">Word 文档 (.docx)</span>
        </label>
      </div>
      <div class="modal-actions">
        <button class="btn btn-tertiary" onclick="toggleExportModal()" data-i18n="exportCancel">取消</button>
        <button class="btn btn-primary" onclick="confirmExport()" data-i18n="exportConfirm">确认导出</button>
      </div>
    </div>
  </div>

  <!-- 设置弹窗 -->
  <div class="modal-overlay" id="settingsModal" onclick="closeSettingsOutside(event)">
    <div class="modal-box">
      <button class="modal-close" onclick="toggleSettings()">&times;</button>
      <div class="modal-title" data-i18n="settingsTitle">设置</div>
      <!-- API 配置 -->
      <div class="modal-section">
        <div class="modal-label" data-i18n="apiConfigLabel">API 配置</div>
        <div class="setting-row">
          <label data-i18n="apiBaseLabel">API 地址</label>
          <input type="text" id="setting-api-base" class="setting-input" placeholder="https://api.openai.com/v1">
          <div class="setting-hint" data-i18n="apiBaseHint">留空使用默认地址</div>
        </div>
        <div class="setting-row">
          <label data-i18n="apiKeyLabel">API 密钥</label>
          <input type="password" id="setting-api-key" class="setting-input" placeholder="sk-...">
        </div>
        <div class="setting-row">
          <label data-i18n="modelNameLabel">模型名称</label>
          <input type="text" id="setting-model" class="setting-input" placeholder="qwen-plus">
        </div>
      </div>
      <hr class="setting-divider">
      <!-- RAG 知识库配置 -->
      <div class="modal-section">
        <div class="modal-label" data-i18n="ragConfigLabel">RAG 知识库</div>
        <div class="setting-row">
          <label class="setting-check">
            <input type="checkbox" id="setting-rag-enabled">
            <span data-i18n="ragEnabledLabel">优先使用本地 RAG 知识库</span>
          </label>
        </div>
        <div class="setting-row">
          <label data-i18n="topNLabel">检索召回数量 (top-n)</label>
          <input type="number" id="setting-top-n" class="setting-input" min="1" max="10" value="3" style="width:80px">
        </div>
      </div>
      <hr class="setting-divider">
      <!-- 主题色 -->
      <div class="modal-section">
        <div class="modal-label" data-i18n="themeLabel">主题色</div>
        <div class="theme-row">
          <div class="theme-dot active" data-color="blue" onclick="switchTheme(this)"></div>
          <div class="theme-dot" data-color="green" onclick="switchTheme(this)"></div>
          <div class="theme-dot" data-color="pink" onclick="switchTheme(this)"></div>
          <div class="theme-dot" data-color="black" onclick="switchTheme(this)"></div>
          <div class="theme-dot" data-color="red" onclick="switchTheme(this)"></div>
        </div>
      </div>
      <!-- 语言 -->
      <div class="modal-section">
        <div class="modal-label" data-i18n="langLabel">语言</div>
        <div class="lang-row">
          <button class="lang-btn active" data-lang="zh" onclick="switchLang('zh')">中文</button>
          <button class="lang-btn" data-lang="en" onclick="switchLang('en')">English</button>
        </div>
      </div>
      <hr class="setting-divider">
      <div class="setting-tip" data-i18n="storageTip">提示：笔记数据保存在浏览器本地 IndexedDB 中。清除浏览器站点数据将清空本地数据库与知识库。</div>
    </div>
  </div>

  <!-- 手动添加批注弹窗 -->
  <div class="modal-overlay" id="manualModal" onclick="closeManualOutside(event)">
    <div class="modal-box" style="min-width:400px;">
      <button class="modal-close" onclick="closeManualModal()">&times;</button>
      <div class="modal-title" data-i18n="manualTitle">手动添加批注</div>
      <div class="modal-selected-text" id="manual-selected-text"></div>
      <div class="modal-section">
        <div class="modal-label" data-i18n="manualTypeLabel">批注类型</div>
        <div class="ann-type-row">
          <label class="ann-type-label checked" id="label-term" onclick="selectAnnType('term')">
            <input type="radio" name="ann-type" value="term" checked> <span data-i18n="typeTerm">术语</span>
          </label>
          <label class="ann-type-label" id="label-sentence" onclick="selectAnnType('sentence')">
            <input type="radio" name="ann-type" value="sentence"> <span data-i18n="typeSentence">句子</span>
          </label>
        </div>
      </div>
      <div class="modal-section">
        <div class="modal-label" data-i18n="manualExplanationLabel">释义说明</div>
        <textarea id="manual-explanation" placeholder="请输入自定义释义…"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-tertiary" onclick="closeManualModal()" data-i18n="btnCancel">取消</button>
        <button class="btn btn-primary" onclick="confirmManualAnnotation()" data-i18n="btnConfirm">确认</button>
      </div>
    </div>
  </div>

  <!-- 历史记录弹窗 -->
  <div class="modal-overlay" id="historyModal" onclick="closeHistoryOutside(event)">
    <div class="modal-box">
      <button class="modal-close" onclick="toggleHistory()">&times;</button>
      <div class="modal-title" data-i18n="historyTitle">历史记录</div>
      <input class="history-search" id="history-search" data-i18n-placeholder="historySearchPlaceholder" placeholder="搜索笔记内容…" oninput="filterHistory()">
      <div class="history-list" id="history-list"></div>
      <div class="history-actions">
        <button class="btn btn-tertiary" onclick="clearAllHistory()" data-i18n="btnClearAllHistory">清空全部</button>
        <button class="btn btn-primary" onclick="toggleHistory()" data-i18n="btnClose">关闭</button>
      </div>
    </div>
  </div>

  <script src="./assets/rag.js"></script>
  <script src="./assets/app.js"></script>
</body>
</html>
